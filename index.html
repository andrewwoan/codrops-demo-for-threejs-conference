<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      href="/media/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />
    <link rel="shortcut icon" href="/media/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/media/apple-touch-icon.png"
    />
    <link rel="manifest" href="/media/site.webmanifest" />

    <meta name="language" content="English" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/og-image.webp" />
    <meta name="description" content="" />
    <meta property="og:description" content="" />

    <title>Three.js Experience</title>
  </head>
  <body>
    <div class="preloader">
      <div class="preloader__inner">
        <div class="preloader__loading">
          <p class="preloader__label">Loading</p>
          <div class="preloader__progress-wrapper">
            <div class="preloader__progress-bar"></div>
          </div>
          <span class="preloader__percent">0%</span>
        </div>

        <div class="preloader__intro">
          <p class="preloader__description">
            Add your intro copy here.
          </p>
          <!-- Two doors into the same board — the only difference is whether
               it makes any sound. Both count as the gesture browsers require
               before audio may play, which is why the choice lives here. -->
          <div class="preloader__buttons">
            <button
              id="enter-audio-btn"
              type="button"
              class="preloader__btn preloader__btn--primary"
            >
              Enter with Audio
            </button>
            <button
              id="enter-silent-btn"
              type="button"
              class="preloader__btn preloader__btn--quiet"
            >
              Enter without Audio
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="experience-wrapper">
      <canvas id="experience-canvas"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
